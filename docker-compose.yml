# AI DevOps Log Monitor & Analyzer Bot
# This application intelligently monitors Docker container logs,
# analyzes critical errors and anomalies using LLMs (Groq, Gemini, Ollama),
# and delivers diagnostics, root-cause analyses, and resolution commands
# directly to your Web UI dashboard.

services:
  ai-devops-bot:
    image: ghcr.io/snchz/ai-devops-bot:latest
    container_name: ai-devops-bot
    restart: unless-stopped
    user: 1000:1000
    group_add:
      - "989"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /home/leif/docker/configs/ai-devops-bot/data:/app/data:z
      - /home/leif/docker/configs/ai-devops-bot/src:/app/src:z
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_PATH=/app/data/history.db
      - LOG_SOURCE=docker
      - DOCKER_SOCKET=/var/run/docker.sock
